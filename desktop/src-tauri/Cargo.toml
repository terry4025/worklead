[package]
name = "worklead"
version = "0.1.0"
description = "Worklead desktop shell: sidecar lifecycle and connection bridge"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "worklead_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-shell = "=2.3.6"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-single-instance = "=2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "worklead"
version = "0.1.0"
description = "Worklead desktop shell: sidecar lifecycle and connection bridge"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "worklead_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon"] }
tauri-plugin-shell = "=2.3.6"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
log = "0.4"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Storage_FileSystem", "Win32_System_WinRT"] }
winreg = "=0.10.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

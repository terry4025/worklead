# 개발용 (autogenerate). 런타임 마이그레이션은 worklead.migrate 가 프로그램으로 수행한다.
[alembic]
prepend_sys_path = .
script_location = worklead/migrations
sqlalchemy.url = sqlite:///./.alembic-dev.sqlite3

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s

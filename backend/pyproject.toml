[project]
name = "worklead-backend"
version = "0.1.0"
description = "Worklead local backend: collection engine, analysis, and local API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "sqlalchemy==2.1.1",
  "alembic==1.20.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest==9.1.1",
]
package = [
  "pyinstaller==6.22.3",
]

[project.scripts]
worklead-backend = "worklead.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worklead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
